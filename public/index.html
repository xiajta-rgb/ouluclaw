<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鸥鹭销售额爬虫</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      color: #f0f6fc;
      padding: 48px 40px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .header p {
      opacity: 0.6;
      font-size: 15px;
      color: #8b949e;
      font-weight: 400;
    }

    .content {
      padding: 48px 40px;
    }

    .form-group {
      margin-bottom: 28px;
    }

    .form-group label {
      display: block;
      margin-bottom: 12px;
      font-weight: 500;
      color: #f0f6fc;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .form-group textarea {
      width: 100%;
      height: 160px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      resize: vertical;
      transition: all 0.2s ease;
      background: rgba(0, 0, 0, 0.3);
      color: #e2e8f0;
      line-height: 1.6;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: rgba(0, 0, 0, 0.4);
    }

    .form-group .hint {
      margin-top: 10px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 400;
    }

    .date-range-group {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
    }

    .date-range-group label {
      display: block;
      margin-bottom: 12px;
      font-weight: 500;
      color: #f0f6fc;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .date-inputs {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .date-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(0, 0, 0, 0.3);
      color: #e2e8f0;
      transition: all 0.2s ease;
    }

    .date-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: rgba(0, 0, 0, 0.4);
    }

    .date-separator {
      font-weight: 500;
      color: #6b7280;
      font-size: 14px;
    }

    .date-range-group .hint {
      margin-top: 10px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 400;
    }

    .account-info {
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.6;
    }

    .account-info strong {
      color: #f0f6fc;
      font-weight: 600;
    }

    .account-info small {
      color: #6b7280;
      font-size: 13px;
      font-weight: 400;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 180px;
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-success:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-success:active {
      transform: translateY(0);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }

    .btn-danger:active {
      transform: translateY(0);
    }

    .btn-sm {
      flex: 0 0 auto !important;
      min-width: auto !important;
      padding: 6px 14px !important;
      font-size: 13px !important;
      white-space: nowrap;
    }

    .btn-icon {
      min-width: auto;
      padding: 10px 16px;
      font-size: 13px;
    }

    /* Toast 样式 */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      max-width: 400px;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      z-index: 9999;
      animation: slideIn 0.3s ease-out;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toast.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .toast.info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #3b82f6;
    }

    .toast .toast-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .toast .toast-message {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
    }

    .toast .toast-close {
      background: none;
      border: none;
      color: inherit;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .toast .toast-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .status {
      margin-top: 32px;
      padding: 16px 20px;
      border-radius: 12px;
      display: none;
      font-weight: 500;
    }

    .status.loading {
      display: block;
      background: rgba(102, 126, 234, 0.1);
      color: #f0f6fc;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }

    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .results {
      margin-top: 32px;
    }

    .status-bar {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #e2e8f0;
    }

    .status-item .icon {
      font-size: 18px;
    }

    .status-item .value {
      font-weight: 600;
      color: #f0f6fc;
    }

    .status-item.success .value {
      color: #10b981;
    }

    .history-section {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .history-header h2 {
      color: #f0f6fc;
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(102, 126, 234, 0.2);
    }

    .history-item .info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .history-item .time {
      color: #6b7280;
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }

    .history-item .stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .history-item .stat {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .history-item .stat.success {
      color: #10b981;
    }

    .history-item .stat.fail {
      color: #ef4444;
    }

    .history-item .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-item .btn-icon {
      min-width: auto;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 40px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 400;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      color: #f0f6fc;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(102, 126, 234, 0.2);
    }

    .summary-card .number {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .summary-card .label {
      font-size: 14px;
      opacity: 0.8;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🦆 鸥鹭销售额爬虫</h1>
      <p>批量爬取鸥鹭网站预估大盘销售额数据</p>
    </div>
    
    <div class="content">
      <div class="account-info">
        <strong>📋 登录账号：</strong>手机号 18060944545，密码 HU69rde4
        <br><small>注意：首次登录需要手动完成滑块验证</small>
      </div>

      <div class="form-group">
        <label for="urls">批量输入网址（每行一个）：</label>
        <textarea id="urls" placeholder="https://vip.oalur.com/analysis/market/chart?pathId=1045624&pathName=T-Shirts&site=US
https://vip.oalur.com/analysis/market/chart?pathId=23575647011&pathName=Polos&site=US">https://vip.oalur.com/analysis/market/chart?pathId=1730985031&pathName=Jumpers(Current)&site=UK
https://vip.oalur.com/analysis/market/chart?pathId=1730996031&pathName=Jackets(Current)&site=UK</textarea>
        <div class="hint">请输入鸥鹭网站的预估大盘销售额页面URL，每行一个</div>
      </div>

      <div class="form-group date-range-group">
        <label>📅 日期范围：</label>
        <div class="date-inputs">
          <input type="month" id="startDate" value="2025-01" class="date-input">
          <span class="date-separator">-</span>
          <input type="month" id="endDate" value="2025-12" class="date-input">
        </div>
        <div class="hint">爬取数据的时间范围，默认 2023-01 至 2025-12</div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="startBtn" onclick="startCrawl()">
          <span>🚀</span>
          <span>开始爬取</span>
        </button>
        <button class="btn btn-success" onclick="loadHistory()">
          <span>📂</span>
          <span>查看历史记录</span>
        </button>
      </div>

      <div class="status" id="status"></div>

      <div class="results" id="results"></div>

      <div class="history-section" id="historySection" style="display: none;">
        <div class="history-header">
          <h2>📊 爬取历史记录</h2>
          <button class="btn btn-danger btn-sm" onclick="deleteAllHistory()">
            <span>🗑️</span>
            <span>删除所有记录</span>
          </button>
        </div>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    async function startCrawl() {
      const urlsText = document.getElementById('urls').value.trim();

      if (!urlsText) {
        showToast('请输入至少一个网址', 'error');
        return;
      }

      const urls = urlsText.split('\n')
        .map(url => url.trim())
        .filter(url => url.length > 0);

      if (urls.length === 0) {
        showToast('请输入有效的网址', 'error');
        return;
      }

      // 获取日期范围
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = true;
      startBtn.textContent = '⏳ 爬取中...';

      showToast(`正在启动浏览器爬取 ${urls.length} 个网址...<br>日期范围: ${startDate} 至 ${endDate}<br>请留意弹出的浏览器窗口，如有滑块验证请手动完成`, 'info', 5000);
      document.getElementById('results').innerHTML = '';

      try {
        const response = await fetch('/api/crawl', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ urls, startDate, endDate })
        });

        const result = await response.json();
        
        if (result.success) {
          displayStatusBar(result.results, urls.length, result.duration);
          const successCount = result.results.filter(r => r.success).length;
          showToast(`爬取完成！成功 ${successCount}/${urls.length} 个`, 'success');
          
          // 添加下载按钮
          if (result.filename) {
            const resultsContainer = document.getElementById('results');
            const downloadHtml = `
              <div style="margin-top: 24px; text-align: center;">
                <button class="btn btn-primary" onclick="downloadResult('${result.filename}')">
                  <span>📥</span>
                  <span>下载本次爬取结果</span>
                </button>
              </div>
            `;
            resultsContainer.insertAdjacentHTML('beforeend', downloadHtml);
          }
        } else {
          showToast('爬取失败: ' + result.error, 'error');
        }
      } catch (error) {
        showToast('请求失败: ' + error.message, 'error');
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = '🚀 开始爬取';
      }
    }

    function displayStatusBar(results, totalUrls, duration) {
      const successCount = results.filter(r => r.success).length;
      const failCount = results.filter(r => !r.success).length;
      const durationText = duration ? `${(duration / 1000).toFixed(1)}秒` : '未知';
      
      const statusHtml = `
        <div class="status-bar">
          <div class="status-item">
            <span class="icon">⏱️</span>
            <span>用时: <span class="value">${durationText}</span></span>
          </div>
          <div class="status-item">
            <span class="icon">📊</span>
            <span>进度: <span class="value">${successCount}/${totalUrls}</span></span>
          </div>
          <div class="status-item ${successCount === totalUrls ? 'success' : ''}">
            <span class="icon">✅</span>
            <span>成功: <span class="value">${successCount}</span></span>
          </div>
          ${failCount > 0 ? `
            <div class="status-item">
              <span class="icon">❌</span>
              <span>失败: <span class="value">${failCount}</span></span>
            </div>
          ` : ''}
        </div>
      `;
      
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = statusHtml;
    }

    async function loadHistory() {
      try {
        const response = await fetch('/api/history');
        const data = await response.json();
        
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');
        
        if (data.success && data.files && data.files.length > 0) {
          historyList.innerHTML = data.files.map(file => `
            <div class="history-item">
              <div class="info">
                <span class="time">${new Date(file.time).toLocaleString()}</span>
                <span class="stats">
                  <span class="stat">${file.totalUrls}个</span>
                  <span class="stat success">✓${file.successCount}</span>
                  ${file.failCount > 0 ? `<span class="stat fail">✗${file.failCount}</span>` : ''}
                </span>
              </div>
              <div class="actions">
                <button class="btn btn-primary btn-icon" onclick="downloadResult('${file.filename}')">下载</button>
                <button class="btn btn-danger btn-icon" onclick="deleteHistory('${file.filename}')">删除</button>
              </div>
            </div>
          `).join('');
          historySection.style.display = 'block';
        } else {
          historyList.innerHTML = '<div class="empty-state">暂无历史记录</div>';
          historySection.style.display = 'block';
        }
      } catch (error) {
        showToast('加载历史记录失败: ' + error.message, 'error');
      }
    }

    async function deleteHistory(filename) {
      showConfirm('确定要删除这条历史记录吗？', async () => {
        try {
          const response = await fetch(`/api/history/${filename}`, {
            method: 'DELETE'
          });
          const result = await response.json();

          if (result.success) {
            showToast('删除成功', 'success');
            loadHistory();
          } else {
            showToast('删除失败: ' + result.error, 'error');
          }
        } catch (error) {
          showToast('删除失败: ' + error.message, 'error');
        }
      });
    }

    async function deleteAllHistory() {
      showConfirm('确定要删除所有爬取记录吗？此操作不可恢复！', async () => {
        try {
          const response = await fetch('/api/history/all', {
            method: 'DELETE'
          });
          const result = await response.json();

          if (result.success) {
            showToast(result.message, 'success');
            document.getElementById('results').innerHTML = '';
            document.getElementById('historySection').style.display = 'none';
          } else {
            showToast('删除失败: ' + result.error, 'error');
          }
        } catch (error) {
          showToast('删除失败: ' + error.message, 'error');
        }
      });
    }

    async function downloadResult(filename) {
      try {
        const response = await fetch(`/api/download/${filename}`);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      } catch (error) {
        showToast('下载失败: ' + error.message, 'error');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Toast 函数
    function showToast(message, type = 'info', duration = 3000) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icons = {
        success: '✅',
        error: '❌',
        info: 'ℹ️'
      };
      
      toast.innerHTML = `
        <span class="toast-icon">${icons[type]}</span>
        <span class="toast-message">${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease-out reverse';
        setTimeout(() => {
          toast.remove();
        }, 300);
      }, duration);
      
      return toast;
    }

    // 确认对话框
    function showConfirm(message, onConfirm, onCancel) {
      const toast = document.createElement('div');
      toast.className = 'toast info';
      
      toast.innerHTML = `
        <span class="toast-icon">⚠️</span>
        <span class="toast-message">${message}</span>
        <div style="display: flex; gap: 8px;">
          <button id="confirmBtn" style="padding: 6px 12px; border: 1px solid rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.1); color: #3b82f6; border-radius: 6px; cursor: pointer; font-size: 13px;">确定</button>
          <button id="cancelBtn" style="padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 13px;">取消</button>
        </div>
      `;
      
      document.body.appendChild(toast);
      
      // 绑定按钮事件
      toast.querySelector('#confirmBtn').onclick = () => {
        if (onConfirm) onConfirm();
        toast.remove();
      };
      toast.querySelector('#cancelBtn').onclick = () => {
        if (onCancel) onCancel();
        toast.remove();
      };
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.innerHTML = message;
      status.className = 'status ' + type;
    }

    function clearResults() {
      document.getElementById('urls').value = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('status').className = 'status';
      document.getElementById('historySection').style.display = 'none';
    }
  </script>
</body>
</html>
